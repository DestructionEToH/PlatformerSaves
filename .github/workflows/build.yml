name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Install Geode CLI Natively
      shell: bash
      run: |
        curl -L -o geode-cli.zip https://github.com
        unzip geode-cli.zip -d geode-cli-dir
        echo "$(pwd)/geode-cli-dir" >> $GITHUB_PATH

    - name: Configure and Build Mod
      shell: bash
      run: |
        export GEODE_SDK="$USERPROFILE/Documents/Geode"
        geode sdk install-binaries
        geode sdk switch v5.4.1
        geode build -p windows

  build-android64:
    name: Build Android64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Install Geode CLI Natively
      shell: bash
      run: |
        curl -L -o geode-cli.zip https://github.com
        unzip geode-cli.zip -d geode-cli-dir
        chmod +x geode-cli-dir/geode
        echo "$(pwd)/geode-cli-dir" >> $GITHUB_PATH

    - name: Configure and Build Mod
      shell: bash
      run: |
        export GEODE_SDK="$HOME/Documents/Geode"
        geode sdk install-binaries
        geode sdk switch v5.4.1
        geode build -p android64
