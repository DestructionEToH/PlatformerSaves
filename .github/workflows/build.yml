name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          platform: windows
        - name: Android32
          os: ubuntu-latest
          platform: android32
        - name: Android64
          os: ubuntu-latest
          platform: android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Setup Official Geode Environment
      uses: geode-sdk/build-geode-mod@main
      with:
        bindings: geode-sdk/bindings
        bindings-ref: main
        combine: false

    - name: Compile Mod via Native Command
      shell: bash
      run: |
        geode build --platform ${{ matrix.config.platform }}
