name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          target: win
        - name: Android64
          os: ubuntu-latest
          target: android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Set up Android NDK
      if: matrix.config.target == 'android64'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Install Geode CLI
      uses: geode-sdk/setup-geode@main
      with:
        sdk: v5.4.1

    - name: Compile Mod via Native CLI
      shell: bash
      run: |
        geode build -p ${{ matrix.config.target }}
