name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          target: win
        - name: Android32
          os: ubuntu-latest
          target: android32
        - name: Android64
          os: ubuntu-latest
          target: android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        bindings: geode-sdk/bindings
        bindings-ref: v5
        combine: true
        target: ${{ matrix.config.target }}
