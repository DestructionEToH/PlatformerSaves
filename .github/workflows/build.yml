name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      GEODE_TARGET_PLATFORM: win
      GEODE_PLATFORM: win
      PLATFORM: win
      TARGET: win
    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        bindings: geode-sdk/bindings
        bindings-ref: main
        combine: true
        target: win
        sdk: v5.4.1

  build-android32:
    name: Build Android32
    runs-on: ubuntu-latest
    env:
      GEODE_TARGET_PLATFORM: android32
      GEODE_PLATFORM: android32
      PLATFORM: android32
      TARGET: android32
    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        bindings: geode-sdk/bindings
        bindings-ref: main
        combine: true
        target: android32
        sdk: v5.4.1

  build-android64:
    name: Build Android64
    runs-on: ubuntu-latest
    env:
      GEODE_TARGET_PLATFORM: android64
      GEODE_PLATFORM: android64
      PLATFORM: android64
      TARGET: android64
    steps:
    - uses: actions/checkout@v4

    - name: Download PersistenceAPI Source
      uses: actions/checkout@v4
      with:
        repository: '0x5abe/PersistenceAPI'
        path: 'PersistenceAPI'

    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        bindings: geode-sdk/bindings
        bindings-ref: main
        combine: true
        target: android64
        sdk: v5.4.1
