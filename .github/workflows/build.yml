name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          platform: win
        - name: Android32
          os: ubuntu-latest
          platform: android32
        - name: Android64
          os: ubuntu-latest
          platform: android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Android NDK
      if: matrix.config.platform == 'android32' || matrix.config.platform == 'android64'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Fetch PersistenceAPI
      shell: bash
      run: |
        mkdir -p build/geode-deps
        curl -L -o build/geode-deps/sabe.persistenceapi.geode https://github.com
      continue-on-error: true

    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        bindings: geode-sdk/bindings
        bindings-ref: v5
        combine: true
        platform: ${{ matrix.config.platform }}
